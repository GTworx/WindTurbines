[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bladerunner"
version = "0.1.0"
description = "BladeRunner - autonomous multi-agent wind turbine blade defect inspection framework."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "WindTurbines" }]
keywords = ["wind-turbine", "defect-detection", "computer-vision", "multi-agent"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

# Core dependencies keep the pipeline importable and runnable end-to-end
# (via the mock backend) without a GPU or large model downloads.
dependencies = [
    "pillow>=10.0",
    "numpy>=1.23",
    "pandas>=1.5",
]

[project.optional-dependencies]
# Local vision model backend (transformers + PyTorch). Heavy; install on demand.
local = [
    "torch>=2.0",
    "transformers>=4.37",
    "torchvision>=0.15",
    "ultralytics>=8.1",
]
dev = [
    "pytest>=7.0",
]

[project.scripts]
bladerunner = "bladerunner.cli:main"

[tool.setuptools.packages.find]
include = ["bladerunner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
